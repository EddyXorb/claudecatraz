# git-cliff configuration — generates release notes from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Generated by git-cliff from the Conventional Commits on main; do not edit by hand.
"""
# Template rendered for each release section. `--current`/`--unreleased` emit a
# single release's body, which is what the release workflow feeds to the draft.
body = """
{% if version %}\
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = false
footer = ""

[git]
conventional_commits = true
# Early history predates Conventional Commits; keep it under "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
# Tags carry no `v` up to 0.2.0; accept both forms.
tag_pattern = "^v?[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

# Map Conventional Commit types to changelog sections; drop noise.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build System" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps?\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
  { message = "^Merge ", skip = true },
  # Squash of #35, whose commits also reached main through #37.
  { sha = "d61a87f857fb28417eb95d6516c194f5571315bf", skip = true },
  { message = ".*", group = "Other" },
]
