name: release

# Two ways to draft a release:
#   1. Push a semver tag (e.g. v0.3.0; 0.1.0/0.2.0 carry no `v`) — the notes
#      cover the commits since the previous tag.
#   2. Trigger manually via Actions UI — provide the target version; the tag is
#      created by gh when the draft release is saved (no need to push a tag first).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs full history + tags to diff against the prior tag.
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        # A manual run names the version; a tag push is the tag itself.
        run: echo "value=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pyproject.toml version
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          pyproject_ver=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          tag_ver="${TAG#v}"
          if [ "$pyproject_ver" != "$tag_ver" ]; then
            echo "ERROR: pyproject.toml version '$pyproject_ver' does not match tag '$TAG'"
            exit 1
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          # --current needs a tag on HEAD; for manual runs use --unreleased instead.
          args: ${{ github.event_name == 'workflow_dispatch' && format('--unreleased --tag {0} --strip all', steps.tag.outputs.value) || '--current --strip all' }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
          NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes "$NOTES"

  # CHANGELOG.md is regenerated from the full history and proposed as a PR, so
  # main only changes through review. Needs "Allow GitHub Actions to create and
  # approve pull requests" in the repository's Actions settings.
  changelog:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Labels the not yet tagged commits of a manual run with the new version.
          args: --tag ${{ needs.draft.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Open changelog PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md already up to date"; exit 0
          fi
          branch="changelog/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md
          git commit -m "chore(release): changelog for $TAG"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Changelog for $TAG" \
            --body "Regenerated by git-cliff for the $TAG release."
